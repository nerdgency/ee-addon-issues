name: "Autograph: feature request"
description: An idea for Autograph, or something it can't do yet.
labels: ["autograph", "enhancement"]
body:
  - type: markdown
    attributes:
      value: Search the existing issues first. If your idea is already there, a 👍 helps decide what gets done first.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you collecting signatures for, and where does Autograph get in the way?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What you'd like
      description: How you'd like it to work. Sketches and examples are welcome.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: What you do now
      description: Any workaround you're using in the meantime.
